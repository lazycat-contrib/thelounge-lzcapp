version: 1

project:
  root: .
  build_config: lzc-build.yml
  package_file: package.yml
  output: output/application.lpk
  target_arch: amd64

update:
  strategy: publish
  allow_downgrade: false
  version_source:
    type: image
    image: thelounge

build:
  run_buildscript: false

images:
  - id: thelounge
    target: service
    service: thelounge
    source: ghcr.io/thelounge/thelounge
    channel: stable
    sort: semver
    tag_regex: '^\d+\.\d+\.\d+$'
    delivery:
      mode: mirror
      image_template: ghcr.1ms.run/thelounge/thelounge:{tag}
      require_digest_match: true

stores:
  official:
    enabled: false
  private:
    enabled: true
    skip_if_version_exists: true
    name: The Lounge
    summary: 由 GitHub Actions 自动发布
